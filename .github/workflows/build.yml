name: Build SLIIT APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Project & Build APK
        run: |
          mkdir -p app/src/main/java/com/sliit/bulksender app/src/main/res/layout app/src/main/res/values app/src/main/res/xml

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SLIIT_Bulk_Sender"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.sliit.bulksender"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.sliit.bulksender"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
              </queries>
              <application android:allowBackup="true" android:label="SLIIT Bulk Sender" android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".WhatsAppAutoSendService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/accessibility_desc" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">SLIIT Bulk Sender</string>
              <string name="accessibility_desc">Auto-clicks the WhatsApp send button</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="20dp">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SLIIT WhatsApp Bulk Sender" android:textSize="22sp" android:textStyle="bold" android:layout_marginBottom="16dp" />
                  <Button android:id="@+id/btnAccessibility" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="1. Enable Auto-Send Permission" android:layout_marginBottom="12dp" />
                  <Button android:id="@+id/btnSelectCsv" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="2. Select Contacts CSV File" android:layout_marginBottom="8dp" />
                  <TextView android:id="@+id/tvCsvStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Loaded Numbers: 0" android:layout_marginBottom="12dp" />
                  <Button android:id="@+id/btnSelectAttachment" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="3. Select Attachment (Image / PDF)" android:layout_marginBottom="8dp" />
                  <TextView android:id="@+id/tvAttachmentStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="No attachment selected" android:layout_marginBottom="12dp" />
                  <EditText android:id="@+id/etPackageName" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="WhatsApp Package (com.whatsapp)" android:text="com.whatsapp" android:layout_marginBottom="12dp" />
                  <EditText android:id="@+id/etMessage" android:layout_width="match_parent" android:layout_height="140dp" android:gravity="top|start" android:hint="Type your message here..." android:inputType="textMultiLine" android:layout_marginBottom="16dp" />
                  <Button android:id="@+id/btnStartBulk" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="4. START SENDING" android:layout_marginBottom="8dp" />
                  <Button android:id="@+id/btnStopBulk" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="STOP" />
              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/java/com/sliit/bulksender/WhatsAppAutoSendService.kt
          package com.sliit.bulksender
          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          class WhatsAppAutoSendService : AccessibilityService() {
              companion object { var shouldAutoClickSend = false }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!shouldAutoClickSend) return
                  val root = rootInActiveWindow ?: return
                  val sendButtons = root.findAccessibilityNodeInfosByViewId("com.whatsapp:id/send")
                  if (sendButtons.isNotEmpty()) {
                      sendButtons[0].performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      shouldAutoClickSend = false
                  }
              }
              override fun onInterrupt() {}
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/sliit/bulksender/MainActivity.kt
          package com.sliit.bulksender
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private var attachmentUri: Uri? = null
              private var numbersList: List<String> = listOf()
              private var currentIndex = 0
              private var isRunning = false
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var tvCsvStatus: TextView
              private lateinit var tvAttachmentStatus: TextView

              private val pickAttachment = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  attachmentUri = uri
                  tvAttachmentStatus.text = if (uri != null) "Attachment Selected" else "No attachment selected"
              }
              private val pickCsvFile = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  uri?.let {
                      val lines = contentResolver.openInputStream(it)?.bufferedReader()?.readLines() ?: emptyList()
                      numbersList = lines.drop(1).mapNotNull { line ->
                          val parts = line.split(",")
                          if (parts.size >= 4) parts[3].replace("+", "").replace(" ", "").trim() else null
                      }
                      tvCsvStatus.text = "Loaded Numbers: ${numbersList.size}"
                  }
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  tvCsvStatus = findViewById(R.id.tvCsvStatus)
                  tvAttachmentStatus = findViewById(R.id.tvAttachmentStatus)
                  val etMessage = findViewById<EditText>(R.id.etMessage)
                  val etPackageName = findViewById<EditText>(R.id.etPackageName)

                  findViewById<Button>(R.id.btnAccessibility).setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  findViewById<Button>(R.id.btnSelectCsv).setOnClickListener { pickCsvFile.launch("*/*") }
                  findViewById<Button>(R.id.btnSelectAttachment).setOnClickListener { pickAttachment.launch("*/*") }
                  findViewById<Button>(R.id.btnStartBulk).setOnClickListener {
                      if (numbersList.isEmpty()) { Toast.makeText(this, "Select CSV file first!", Toast.LENGTH_SHORT).show(); return@setOnClickListener }
                      isRunning = true; currentIndex = 0
                      val pkg = etPackageName.text.toString().trim().ifEmpty { "com.whatsapp" }
                      sendNext(etMessage.text.toString(), pkg)
                  }
                  findViewById<Button>(R.id.btnStopBulk).setOnClickListener { isRunning = false; handler.removeCallbacksAndMessages(null) }
              }
              private fun sendNext(message: String, pkg: String) {
                  if (!isRunning || currentIndex >= numbersList.size) { isRunning = false; Toast.makeText(this, "Finished!", Toast.LENGTH_LONG).show(); return }
                  val phone = numbersList[currentIndex]
                  try {
                      val intent = Intent(Intent.ACTION_SEND).apply {
                          type = if (attachmentUri != null) contentResolver.getType(attachmentUri!!) else "text/plain"
                          setPackage(pkg)
                          putExtra("jid", "$phone@s.whatsapp.net")
                          putExtra(Intent.EXTRA_TEXT, message)
                          attachmentUri?.let { putExtra(Intent.EXTRA_STREAM, it) }
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      WhatsAppAutoSendService.shouldAutoClickSend = true
                      startActivity(intent)
                      currentIndex++
                      handler.postDelayed({ sendNext(message, pkg) }, (9000..14000).random().toLong())
                  } catch (e: Exception) { currentIndex++; handler.postDelayed({ sendNext(message, pkg) }, 3000) }
              }
          }
          EOF

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SLIIT-Bulk-Sender-APK
          path: app/build/outputs/apk/debug/app-debug.apk
